name: main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  lint_python:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 

      - name: Install dependencies
        run: pip install flake8
      
      - name: Lint with flake8
        run: flake8 src/
  
  lint_docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: lint_python

    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
  
  run_tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: lint_docker

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest test/
  
  build_docker_image:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: run_tests

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: user/hivebox:latest
